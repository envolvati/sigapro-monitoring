receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*.log
    include_file_path: true
    start_at: end
    operators:
      - type: json_parser
        parse_to: attributes
      - type: move
        from: attributes.log
        to: body
      - type: time_parser
        parse_from: attributes.time
        layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[^/]+)/.*$'

processors:
  batch:

  # Processador para garantir que todos os dados tenham as tags de ambiente
  resource/env:
    attributes:
      - key: environment
        from_attribute: env
        action: upsert

exporters:
  # O coração dos Traces (A linha do tempo do Grafana via gRPC)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # O coração dos Logs (Onde os textos puros e erros vão morar via HTTP nativo OTLP)
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"

  # A ponte para o Prometheus puxar as métricas da sua aplicação
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Printa no terminal para ajudar no debug inicial pelo Coolify
  debug:
    verbosity: basic

# Extensões de diagnóstico interno do Collector
extensions:
  health_check:
  pprof:
    endpoint: :1888
  zpages:
    endpoint: :55679

service:
  # Expõe as métricas internas de saúde do próprio OTel para o Prometheus
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  extensions: [pprof, zpages, health_check]

  # As "Rodovias" por onde os dados trafegam
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]

    # Nova rodovia para sugar o terminal do Docker e jogar no Loki
    logs/docker:
      receivers: [filelog/docker]
      processors: [batch]
      exporters: [otlphttp/loki, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
